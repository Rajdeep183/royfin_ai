  AMD: "Advanced Micro Devices"
  CRM: "Salesforce Inc."
  PYPL: "PayPal Holdings Inc."
  ADBE: "Adobe Inc."
  INTC: "Intel Corporation"
  CSCO: "Cisco Systems Inc."
  PEP: "PepsiCo Inc."
  KO: "The Coca-Cola Company"
  WMT: "Walmart Inc."
  JNJ: "Johnson & Johnson"
