name: 'Automated Data Ingestion & Model Retraining'

on:
  # Scheduled runs - nightly at midnight UTC (during market closed hours)
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  
  # Manual trigger for testing and on-demand runs
  workflow_dispatch:
    inputs:
      ticker_symbols:
        description: 'Comma-separated list of ticker symbols to process (default: AAPL,GOOGL,MSFT,TSLA,SPY)'
        required: false
        default: 'AAPL,GOOGL,MSFT,TSLA,SPY'
        type: string
      days_of_data:
        description: 'Number of days of historical data to fetch'
        required: false
        default: '1825'  # 5 years
        type: string
      force_retrain:
        description: 'Force model retraining even if recent training exists'
        required: false
        default: false
        type: boolean
      skip_lambda:
        description: 'Skip AWS Lambda trigger (for testing data ingestion only)'
        required: false
        default: false
        type: boolean

env:
  # Python configuration
  PYTHON_VERSION: '3.11'
  PIP_CACHE_DIR: ~/.cache/pip
  
  # Data storage configuration
  DATA_STORAGE_PATH: 'data/financial'
  MODELS_STORAGE_PATH: 'models'
  ARTIFACTS_RETENTION_DAYS: 30
  
  # Market configuration
  MARKET_TIMEZONE: 'America/New_York'
  DEFAULT_TICKERS: 'AAPL,GOOGL,MSFT,TSLA,SPY,QQQ,VTI,BND,GLD,^VIX'

jobs:
  # Data validation and environment setup
  setup-and-validate:
    name: 'Setup Environment & Validate Market Hours'
    runs-on: ubuntu-latest
    outputs:
      should_run_ingestion: ${{ steps.market_check.outputs.should_run }}
      market_status: ${{ steps.market_check.outputs.status }}
      run_timestamp: ${{ steps.timestamp.outputs.timestamp }}
      tickers_to_process: ${{ steps.tickers.outputs.list }}
    
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 'Set up Python'
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 'Install Dependencies'
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy pytz datetime-utils
          
      - name: 'Generate Run Timestamp'
        id: timestamp
        run: |
          timestamp=$(date -u +"%Y%m%d_%H%M%S")
          echo "timestamp=$timestamp" >> $GITHUB_OUTPUT
          echo "📅 Run timestamp: $timestamp"

      - name: 'Validate Market Hours and Data Availability'
        id: market_check
        run: |
          python3 << 'EOF'
          import yfinance as yf
          import pytz
          from datetime import datetime, timedelta
          import json
          import os
          
          # Check market hours (basic validation)
          ny_tz = pytz.timezone('America/New_York')
          utc_now = datetime.now(pytz.UTC)
          ny_now = utc_now.astimezone(ny_tz)
          
          # Market is typically closed on weekends
          is_weekend = ny_now.weekday() >= 5
          
          # For data ingestion, we can run anytime (historical data)
          # But we'll note the market status for logging
          market_status = "closed" if is_weekend else "unknown"
          
          # Always allow data ingestion (we're getting historical data)
          should_run = True
          
          print(f"🕐 Current time (NY): {ny_now.strftime('%Y-%m-%d %H:%M:%S %Z')}")
          print(f"📊 Market status: {market_status}")
          print(f"✅ Should run ingestion: {should_run}")
          
          # Test data connectivity
          try:
              test_ticker = yf.Ticker("AAPL")
              test_data = test_ticker.history(period="5d")
              if test_data.empty:
                  print("⚠️ Warning: No test data retrieved")
                  should_run = False
              else:
                  print(f"✅ Data connectivity test passed ({len(test_data)} days)")
          except Exception as e:
              print(f"❌ Data connectivity test failed: {e}")
              should_run = False
          
          # Write outputs
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"should_run={str(should_run).lower()}\n")
              f.write(f"status={market_status}\n")
          EOF

      - name: 'Prepare Ticker List'
        id: tickers
        run: |
          if [ "${{ github.event.inputs.ticker_symbols }}" != "" ]; then
            tickers="${{ github.event.inputs.ticker_symbols }}"
          else
            tickers="${{ env.DEFAULT_TICKERS }}"
          fi
          echo "list=$tickers" >> $GITHUB_OUTPUT
          echo "📋 Tickers to process: $tickers"

  # Data ingestion job
  data-ingestion:
    name: 'Financial Data Ingestion'
    runs-on: ubuntu-latest
    needs: setup-and-validate
    if: needs.setup-and-validate.outputs.should_run_ingestion == 'true'
    
    strategy:
      matrix:
        # Process tickers in parallel for efficiency
        ticker: [AAPL, GOOGL, MSFT, TSLA, SPY]
      fail-fast: false
      max-parallel: 5
      
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Set up Python Environment'
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 'Install Required Dependencies'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_streamlit.txt
          # Install additional dependencies for data processing
          pip install boto3 awscli python-dotenv requests retrying

      - name: 'Create Data Directories'
        run: |
          mkdir -p ${{ env.DATA_STORAGE_PATH }}/raw
          mkdir -p ${{ env.DATA_STORAGE_PATH }}/processed
          mkdir -p ${{ env.DATA_STORAGE_PATH }}/validation
          mkdir -p logs

      - name: 'Data Ingestion with yfinance'
        id: ingestion
        env:
          TICKER: ${{ matrix.ticker }}
          DAYS_OF_DATA: ${{ github.event.inputs.days_of_data || '1825' }}
          RUN_TIMESTAMP: ${{ needs.setup-and-validate.outputs.run_timestamp }}
        run: |
          python3 << 'EOF'
          import yfinance as yf
          import pandas as pd
          import numpy as np
          import json
          import os
          from datetime import datetime, timedelta
          from retrying import retry
          import logging
          
          # Setup logging
          logging.basicConfig(
              level=logging.INFO,
              format='%(asctime)s - %(levelname)s - %(message)s',
              handlers=[
                  logging.FileHandler(f"logs/ingestion_{os.environ['TICKER']}_{os.environ['RUN_TIMESTAMP']}.log"),
                  logging.StreamHandler()
              ]
          )
          logger = logging.getLogger(__name__)
          
          @retry(stop_max_attempt_number=3, wait_fixed=2000)
          def fetch_ticker_data(ticker, days):
              """Fetch data with retry logic"""
              logger.info(f"🔄 Fetching data for {ticker} ({days} days)")
              
              # Calculate date range
              end_date = datetime.now()
              start_date = end_date - timedelta(days=int(days))
              
              # Fetch main data
              ticker_obj = yf.Ticker(ticker)
              df = ticker_obj.history(
                  start=start_date.strftime('%Y-%m-%d'),
                  end=end_date.strftime('%Y-%m-%d'),
                  interval="1d",
                  auto_adjust=True,
                  prepost=True
              )
              
              if df.empty:
                  raise ValueError(f"No data retrieved for {ticker}")
              
              # Add metadata
              df['Symbol'] = ticker
              df['DataSource'] = 'yfinance'
              df['IngestionTimestamp'] = datetime.now().isoformat()
              
              # Calculate basic technical indicators
              df['SMA_20'] = df['Close'].rolling(window=20).mean()
              df['SMA_50'] = df['Close'].rolling(window=50).mean()
              df['RSI'] = calculate_rsi(df['Close'])
              df['Volatility'] = df['Close'].pct_change().rolling(window=20).std() * np.sqrt(252)
              
              # Add market context if ticker is not market index
              if not ticker.startswith('^') and ticker not in ['SPY', 'QQQ', 'VTI']:
                  try:
                      spy = yf.Ticker('SPY').history(
                          start=start_date.strftime('%Y-%m-%d'),
                          end=end_date.strftime('%Y-%m-%d')
                      )
                      if not spy.empty:
                          # Align indices
                          common_dates = df.index.intersection(spy.index)
                          if len(common_dates) > 0:
                              df_aligned = df.loc[common_dates]
                              spy_aligned = spy.loc[common_dates]
                              
                              # Calculate beta
                              returns = df_aligned['Close'].pct_change()
                              market_returns = spy_aligned['Close'].pct_change()
                              beta = returns.cov(market_returns) / market_returns.var()
                              df['Beta_SPY'] = beta
                              
                  except Exception as e:
                      logger.warning(f"Could not add market context: {e}")
              
              return df
          
          def calculate_rsi(prices, window=14):
              """Calculate RSI indicator"""
              delta = prices.diff()
              gain = (delta.where(delta > 0, 0)).rolling(window=window).mean()
              loss = (-delta.where(delta < 0, 0)).rolling(window=window).mean()
              rs = gain / loss
              return 100 - (100 / (1 + rs))
          
          def validate_data(df, ticker):
              """Validate the fetched data"""
              validation_results = {
                  'ticker': ticker,
                  'total_records': len(df),
                  'date_range': {
                      'start': df.index.min().strftime('%Y-%m-%d'),
                      'end': df.index.max().strftime('%Y-%m-%d')
                  },
                  'missing_values': df.isnull().sum().to_dict(),
                  'price_range': {
                      'min': float(df['Close'].min()),
                      'max': float(df['Close'].max()),
                      'latest': float(df['Close'].iloc[-1])
                  },
                  'validation_passed': True,
                  'issues': []
              }
              
              # Validation checks
              if len(df) < 100:
                  validation_results['validation_passed'] = False
                  validation_results['issues'].append('Insufficient data points')
              
              if df['Close'].isnull().sum() > len(df) * 0.1:
                  validation_results['validation_passed'] = False
                  validation_results['issues'].append('Too many missing price values')
              
              if df['Volume'].mean() < 1000:
                  validation_results['issues'].append('Low trading volume detected')
              
              return validation_results
          
          # Main execution
          try:
              ticker = os.environ['TICKER']
              days = os.environ['DAYS_OF_DATA']
              timestamp = os.environ['RUN_TIMESTAMP']
              
              logger.info(f"🚀 Starting data ingestion for {ticker}")
              
              # Fetch data
              data = fetch_ticker_data(ticker, days)
              logger.info(f"✅ Successfully fetched {len(data)} records for {ticker}")
              
              # Validate data
              validation = validate_data(data, ticker)
              logger.info(f"🔍 Data validation: {'PASSED' if validation['validation_passed'] else 'FAILED'}")
              
              if validation['issues']:
                  for issue in validation['issues']:
                      logger.warning(f"⚠️ Validation issue: {issue}")
              
              # Save raw data
              raw_file = f"{os.environ['DATA_STORAGE_PATH']}/raw/{ticker}_{timestamp}.csv"
              data.to_csv(raw_file)
              logger.info(f"💾 Raw data saved to {raw_file}")
              
              # Save processed data (last 252 trading days for model training)
              processed_data = data.tail(252).copy()
              processed_file = f"{os.environ['DATA_STORAGE_PATH']}/processed/{ticker}_latest.csv"
              processed_data.to_csv(processed_file)
              logger.info(f"📊 Processed data saved to {processed_file}")
              
              # Save validation results
              validation_file = f"{os.environ['DATA_STORAGE_PATH']}/validation/{ticker}_{timestamp}_validation.json"
              with open(validation_file, 'w') as f:
                  json.dump(validation, f, indent=2, default=str)
              
              # Set outputs for next job
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"success=true\n")
                  f.write(f"records_count={len(data)}\n")
                  f.write(f"validation_passed={validation['validation_passed']}\n")
                  f.write(f"raw_file={raw_file}\n")
                  f.write(f"processed_file={processed_file}\n")
              
              logger.info(f"🎉 Data ingestion completed successfully for {ticker}")
              
          except Exception as e:
              logger.error(f"❌ Data ingestion failed for {ticker}: {str(e)}")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"success=false\n")
                  f.write(f"error={str(e)}\n")
              raise
          
          EOF

      - name: 'Upload Data Artifacts'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-data-${{ matrix.ticker }}-${{ needs.setup-and-validate.outputs.run_timestamp }}
          path: |
            ${{ env.DATA_STORAGE_PATH }}/**/*${{ matrix.ticker }}*
            logs/*${{ matrix.ticker }}*
          retention-days: ${{ env.ARTIFACTS_RETENTION_DAYS }}

  # AWS Lambda trigger for model retraining
  trigger-model-retraining:
    name: 'Trigger AWS Lambda Model Retraining'
    runs-on: ubuntu-latest
    needs: [setup-and-validate, data-ingestion]
    if: |
      always() &&
      needs.setup-and-validate.outputs.should_run_ingestion == 'true' &&
      needs.data-ingestion.result == 'success' &&
      github.event.inputs.skip_lambda != 'true'
    
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Configure AWS CLI'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: 'Verify AWS Configuration'
        run: |
          echo "🔧 Verifying AWS configuration..."
          aws sts get-caller-identity
          echo "✅ AWS configuration verified"

      - name: 'Prepare Lambda Payload'
        id: payload
        run: |
          python3 << 'EOF'
          import json
          import os
          
          # Prepare payload for Lambda function
          payload = {
              "source": "github_actions",
              "workflow_run_id": "${{ github.run_id }}",
              "timestamp": "${{ needs.setup-and-validate.outputs.run_timestamp }}",
              "trigger_type": "scheduled" if "${{ github.event_name }}" == "schedule" else "manual",
              "tickers": "${{ needs.setup-and-validate.outputs.tickers_to_process }}".split(','),
              "force_retrain": "${{ github.event.inputs.force_retrain }}" == "true",
              "market_status": "${{ needs.setup-and-validate.outputs.market_status }}",
              "data_ingestion": {
                  "completed": True,
                  "artifacts_available": True
              },
              "configuration": {
                  "ensemble_size": 5,
                  "epochs": 100,
                  "optimize_hyperparams": True,
                  "validation_split": 0.2
              }
          }
          
          # Save payload to file
          with open('lambda_payload.json', 'w') as f:
              json.dump(payload, f, indent=2)
          
          print("📋 Lambda payload prepared:")
          print(json.dumps(payload, indent=2))
          
          # Set output for use in next step
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"payload_file=lambda_payload.json\n")
          EOF

      - name: 'Invoke AWS Lambda for Model Retraining'
        id: lambda_invoke
        env:
          LAMBDA_FUNCTION_NAME: ${{ secrets.AWS_LAMBDA_FUNCTION_NAME || 'royfin-ai-model-trainer' }}
        run: |
          echo "🚀 Invoking AWS Lambda function: $LAMBDA_FUNCTION_NAME"
          
          # Invoke Lambda function asynchronously
          aws lambda invoke \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --invocation-type Event \
            --payload file://lambda_payload.json \
            --cli-read-timeout 0 \
            --cli-connect-timeout 60 \
            lambda_response.json
          
          echo "✅ Lambda function invoked successfully"
          
          # Check if response file exists and show content
          if [ -f lambda_response.json ]; then
            echo "📋 Lambda response:"
            cat lambda_response.json
          fi
          
          # Set output
          echo "success=true" >> $GITHUB_OUTPUT

      - name: 'Monitor Lambda Execution (Optional)'
        if: steps.lambda_invoke.outputs.success == 'true'
        run: |
          echo "🔄 Lambda function has been triggered for model retraining"
          echo "⏰ Training typically takes 15-30 minutes depending on data size"
          echo "📊 Check AWS CloudWatch logs for detailed training progress"
          echo "🔗 Function: ${{ env.LAMBDA_FUNCTION_NAME }}"

      - name: 'Upload Lambda Artifacts'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lambda-invocation-${{ needs.setup-and-validate.outputs.run_timestamp }}
          path: |
            lambda_payload.json
            lambda_response.json
          retention-days: 7

  # Monitoring and notification job
  workflow-summary:
    name: 'Workflow Summary & Notifications'
    runs-on: ubuntu-latest
    needs: [setup-and-validate, data-ingestion, trigger-model-retraining]
    if: always()
    
    steps:
      - name: 'Generate Workflow Summary'
        run: |
          echo "## 📊 RoyFin AI - Data Ingestion & Model Retraining Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Run:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** ${{ needs.setup-and-validate.outputs.run_timestamp }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🎯 Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Setup & Validation | ${{ needs.setup-and-validate.result }} | Market: ${{ needs.setup-and-validate.outputs.market_status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Data Ingestion | ${{ needs.data-ingestion.result }} | Tickers: ${{ needs.setup-and-validate.outputs.tickers_to_process }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lambda Trigger | ${{ needs.trigger-model-retraining.result }} | Model Retraining |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.setup-and-validate.result }}" = "success" ] && [ "${{ needs.data-ingestion.result }}" = "success" ]; then
            echo "✅ **Overall Status:** SUCCESS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📈 Data ingestion completed successfully" >> $GITHUB_STEP_SUMMARY
            if [ "${{ needs.trigger-model-retraining.result }}" = "success" ]; then
              echo "🤖 Model retraining triggered on AWS Lambda" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ **Overall Status:** FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the individual job logs for error details." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Monitor AWS CloudWatch for Lambda execution logs" >> $GITHUB_STEP_SUMMARY
          echo "- Check uploaded artifacts for processed data" >> $GITHUB_STEP_SUMMARY
          echo "- Verify model performance after retraining completes" >> $GITHUB_STEP_SUMMARY

      - name: 'Slack Notification (Optional)'
        if: always() && vars.SLACK_WEBHOOK_URL
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Send Slack notification if webhook is configured
          python3 << 'EOF'
          import json
          import os
          import requests
          
          webhook_url = os.environ.get('SLACK_WEBHOOK_URL')
          if not webhook_url:
              print("No Slack webhook configured, skipping notification")
              exit(0)
          
          # Determine status and color
          data_status = "${{ needs.data-ingestion.result }}"
          lambda_status = "${{ needs.trigger-model-retraining.result }}"
          
          if data_status == "success" and lambda_status == "success":
              color = "good"
              status_emoji = "✅"
              status_text = "SUCCESS"
          elif data_status == "success":
              color = "warning" 
              status_emoji = "⚠️"
              status_text = "PARTIAL SUCCESS"
          else:
              color = "danger"
              status_emoji = "❌" 
              status_text = "FAILED"
          
          payload = {
              "attachments": [{
                  "color": color,
                  "title": f"{status_emoji} RoyFin AI - Data Ingestion & Model Training",
                  "text": f"Status: {status_text}",
                  "fields": [
                      {
                          "title": "Workflow Run",
                          "value": "${{ github.run_id }}",
                          "short": True
                      },
                      {
                          "title": "Timestamp", 
                          "value": "${{ needs.setup-and-validate.outputs.run_timestamp }}",
                          "short": True
                      },
                      {
                          "title": "Tickers Processed",
                          "value": "${{ needs.setup-and-validate.outputs.tickers_to_process }}",
                          "short": False
                      }
                  ],
                  "footer": "GitHub Actions",
                  "ts": "${{ github.event.head_commit.timestamp }}"
              }]
          }
          
          try:
              response = requests.post(webhook_url, json=payload)
              response.raise_for_status()
              print("✅ Slack notification sent successfully")
          except Exception as e:
              print(f"❌ Failed to send Slack notification: {e}")
          EOF